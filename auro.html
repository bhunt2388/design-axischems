<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auro · Label Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1C2639; --navy2:#2B3650;
  --tan:#C6B198; --tan2:#B9A07F;
  --dark:#0A0A08; --dark2:#141410; --dark3:#1E1E18;
  --cream:#F3F1EC; --cream2:#EDE8D6;
  --text:#1A1A14; --text2:#5A5640; --text3:#9A9470;
  --white:#FFFFFF;
}
body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;-webkit-font-smoothing:antialiased}

/* TOPBAR */
.topbar{height:56px;background:var(--dark2);border-bottom:1px solid rgba(198,177,152,0.2);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}
.tb-brand{display:flex;align-items:center;gap:12px}
.tb-logo{width:32px;height:32px}
.tb-name{font-size:16px;font-weight:700;letter-spacing:0.04em;color:var(--tan)}
.tb-name span{color:var(--cream);opacity:0.5;font-weight:300;font-size:13px;margin-left:8px}
.tb-back{font-size:12px;color:var(--text3);text-decoration:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid rgba(198,177,152,0.2);border-radius:5px;transition:all 0.15s}
.tb-back:hover{color:var(--tan);border-color:rgba(198,177,152,0.5)}
.tb-meta{font-size:11px;color:var(--text3);letter-spacing:0.08em}
.tb-export{padding:8px 18px;background:var(--tan);color:var(--dark);font-weight:700;font-size:13px;border:none;border-radius:6px;cursor:pointer;letter-spacing:0.04em;transition:all 0.15s}
.tb-export:hover{background:var(--tan2)}

/* LAYOUT */
.wrap{display:flex;min-height:calc(100vh - 56px)}

/* PANEL */
.panel{width:300px;flex-shrink:0;background:var(--dark2);border-right:1px solid rgba(198,177,152,0.15);overflow-y:auto}
.panel::-webkit-scrollbar{width:3px}.panel::-webkit-scrollbar-thumb{background:rgba(198,177,152,0.2)}
.pi{padding:16px}
.sec{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--tan);opacity:0.8;margin:16px 0 9px;font-weight:600;border-top:1px solid rgba(198,177,152,0.12);padding-top:13px}
.sec.first{border-top:none;margin-top:0;padding-top:0}
label{display:block;font-size:11px;margin:6px 0 3px;color:var(--text3);letter-spacing:0.02em}
input[type=text],select{width:100%;padding:8px 10px;border-radius:5px;border:1px solid rgba(198,177,152,0.2);background:rgba(255,255,255,0.04);color:var(--cream);font-size:13px;font-family:'Inter',sans-serif}
input[type=number]{padding:7px 8px;border-radius:5px;border:1px solid rgba(198,177,152,0.2);background:rgba(255,255,255,0.04);color:var(--cream);font-size:13px;width:100%;text-align:center}
input:focus,select:focus{outline:none;border-color:var(--tan)}
select{cursor:pointer}
.row{display:flex;gap:7px;align-items:flex-end;margin-bottom:2px}
.grow{flex:1}.sw{width:64px}
.swl{font-size:10px;color:var(--text3)}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:4px;background:rgba(198,177,152,0.2);border:none;padding:0;margin:5px 0 3px;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--tan);border:2px solid var(--dark);cursor:pointer}
.szrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.btn{margin-top:8px;width:100%;padding:9px;border:0;border-radius:6px;background:var(--tan);color:var(--dark);font-weight:700;cursor:pointer;font-size:13px;transition:background .15s}
.btn:hover{background:var(--tan2)}
.btn.alt{background:rgba(198,177,152,0.08);border:1px solid rgba(198,177,152,0.2);color:var(--text3)}
.btn.alt:hover{background:rgba(198,177,152,0.15);color:var(--cream)}
small{color:var(--text3);font-size:11px;line-height:1.6;display:block;margin-top:8px}

/* STAGE */
.stage{flex:1;background:#08080A;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;overflow:auto;gap:12px}
.stage-lbl{font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(198,177,152,0.4);font-weight:600}
.stage-inner{width:100%;max-width:960px}
svg#lbl{width:100%;height:auto;display:block;border-radius:4px;box-shadow:0 0 0 1px rgba(198,177,152,0.15),0 12px 60px rgba(0,0,0,0.8)}
.drag{cursor:grab}.drag:active{cursor:grabbing}

/* tpl */
.tpl-row{display:flex;gap:5px;margin-bottom:5px;align-items:center}
.tpl-name{flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(198,177,152,0.2);color:var(--cream);padding:5px 8px;border-radius:5px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-load{padding:5px 11px;border-radius:5px;background:rgba(198,177,152,0.12);border:1px solid rgba(198,177,152,0.2);color:var(--tan);cursor:pointer;font-size:12px;font-weight:700}
.tpl-load:hover{background:rgba(198,177,152,0.22)}
.tpl-del{padding:5px 9px;border-radius:5px;background:transparent;border:1px solid rgba(185,28,28,0.2);color:#f87171;cursor:pointer;font-size:12px}
.tpl-del:hover{background:rgba(185,28,28,0.15)}
.tpl-empty{font-size:12px;color:var(--text3);font-style:italic;padding:4px 0}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-brand">
    <!-- Auro mark — mini, tan-on-dark for topbar legibility -->
    <svg class="tb-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 9.5,21.5 A 11,11 0 1 1 22.5,21.5" fill="none" stroke="#C6B198" stroke-width="1.3" stroke-linecap="round"/>
      <g transform="translate(16,18) scale(0.95)">
        <path d="M0,7 Q-1.6,2.7 0,-2.6 Q1.6,2.7 0,7 Z" fill="none" stroke="#C6B198" stroke-width="1.1"/>
        <path d="M0,7 Q-3.9,5.8 -5.3,1.1 Q-1.4,4.1 0,7 Z" fill="none" stroke="#C6B198" stroke-width="1.1"/>
        <path d="M0,7 Q3.9,5.8 5.3,1.1 Q1.4,4.1 0,7 Z" fill="none" stroke="#C6B198" stroke-width="1.1"/>
        <path d="M0,7 Q-4.4,6.6 -6.3,4.1 Q-2.7,4.7 0,7 Z" fill="none" stroke="#C6B198" stroke-width="1.1"/>
        <path d="M0,7 Q4.4,6.6 6.3,4.1 Q2.7,4.7 0,7 Z" fill="none" stroke="#C6B198" stroke-width="1.1"/>
        <circle cx="0" cy="-0.8" r="0.9" fill="#C6B198"/>
        <path d="M0,0.1 L-2.5,-1.2 M0,0.1 L2.5,-1.2 M0,0.1 L0,4 M0,4 L-2,6.5 M0,4 L2,6.5" stroke="#C6B198" stroke-width="0.7" stroke-linecap="round" fill="none"/>
      </g>
    </svg>
    <div class="tb-name">AURO <span>— Label Studio</span></div>
  </div>
  <div class="tb-meta">1.75″ × 0.75″ · CREAM / NAVY</div>
  <div style="display:flex;align-items:center;gap:8px">
    <a href="/" class="tb-back">← All Brands</a>
    <button class="tb-export" onclick="dl('png')">⬇ Export PNG</button>
  </div>
</div>

<div class="wrap">
 <div class="panel"><div class="pi">

  <div class="sec first">Saved Templates</div>
  <div id="tplList"><div class="tpl-empty">No templates yet.</div></div>

  <div class="sec">Quick Load · Library</div>
  <select id="preset"><option value="">— Select compound —</option></select>

  <div class="sec">Label Text</div>
  <label>Descriptor · <span id="prodSzVal">34</span> px</label>
  <div class="szrow">
    <input type="range" id="sz_PRODUCT" min="16" max="80" value="34" style="flex:1;margin:0">
    <input type="number" id="sz_PRODUCT_num" min="16" max="80" value="34" style="width:54px">
  </div>
  <input type="text" id="in_PRODUCT" value="BACTERIOSTATIC WATER">

  <div class="row" style="margin-top:9px">
    <div class="grow"><label>Volume / Dose</label><input type="text" id="in_DOSE" value="30 ML"></div>
    <div class="sw"><label class="swl">px</label><input type="number" id="sz_DOSE" min="12" max="80" value="28"></div>
  </div>

  <div class="sec">Scale</div>
  <label>Overall · <span id="scaleVal">100%</span></label>
  <input type="range" id="scale" min="0.5" max="1.5" step="0.02" value="1">

  <button class="btn alt" id="resetPos" style="margin-top:12px">↺ Reset Positions</button>
  <small>Drag the descriptor or volume line to reposition. Save your layout as a template.</small>

  <div class="sec">Templates</div>
  <button class="btn" onclick="saveTpl()" style="background:linear-gradient(135deg,#C6B198,#B9A07F);color:#0A0A08">💾 Save Template</button>

  <div class="sec">Export</div>
  <button class="btn" onclick="dl('png')">⬇ PNG · 3360×1440 print</button>
  <button class="btn alt" onclick="dl('svg')" style="margin-top:6px">⬇ SVG · vector</button>

 </div></div>

 <div class="stage">
  <div class="stage-lbl">Auro · 1.75″ × 0.75″ Label Preview</div>
  <div class="stage-inner">
  <!-- SVG LABEL: 1680×720 viewBox -->
  <svg id="lbl" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1680 720">

   <!-- ── CREAM BACKGROUND ── -->
   <rect width="1680" height="720" fill="#F3F1EC"/>

   <!-- ── AURO EMBLEM — open arc + lotus + rising figure, centered ── -->
   <g transform="translate(840,208)">
     <!-- open arc, gap at bottom -->
     <path d="M -62.5,108.25 A 125,125 0 1 1 62.5,108.25" fill="none" stroke="#1C2639" stroke-width="2.4" stroke-linecap="round"/>
     <g transform="scale(1.25)">
       <!-- lotus petals, outline only -->
       <path d="M0,80 Q-16,25 0,-30 Q16,25 0,80 Z" fill="none" stroke="#1C2639" stroke-width="2.6"/>
       <path d="M0,80 Q-35.5,52.9 -48,10 Q-12.5,37.1 0,80 Z" fill="none" stroke="#1C2639" stroke-width="2.6"/>
       <path d="M0,80 Q35.5,52.9 48,10 Q12.5,37.1 0,80 Z" fill="none" stroke="#1C2639" stroke-width="2.6"/>
       <path d="M0,80 Q-40.36,73.2 -70,45 Q-29.64,51.8 0,80 Z" fill="none" stroke="#1C2639" stroke-width="2.6"/>
       <path d="M0,80 Q40.36,73.2 70,45 Q29.64,51.8 0,80 Z" fill="none" stroke="#1C2639" stroke-width="2.6"/>
       <!-- rising figure -->
       <circle cx="0" cy="-5" r="9" fill="#1C2639"/>
       <path d="M0,8 L-30,-15 M0,8 L30,-15 M0,8 L0,45 M0,45 L-22,78 M0,45 L22,78"
         fill="none" stroke="#1C2639" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
     </g>
   </g>

   <!-- ── AURO WORDMARK ── -->
   <text x="840" y="468" text-anchor="middle"
     font-family="'Inter',sans-serif" font-weight="300" font-size="116" letter-spacing="20" fill="#1C2639">AURO</text>

   <!-- ── DIVIDER: tan line + center dot ── -->
   <line x1="660" y1="516" x2="1020" y2="516" stroke="#C6B198" stroke-width="2"/>
   <circle cx="840" cy="516" r="5.5" fill="#B9A07F"/>

   <!-- ── DRAGGABLE TEXT ── -->
   <g id="gPRODUCT" class="drag" transform="translate(0,0)">
     <text id="PRODUCT" x="840" y="588" text-anchor="middle"
       font-family="'Inter',sans-serif" font-weight="500"
       font-size="34" letter-spacing="9" fill="#1C2639">BACTERIOSTATIC WATER</text>
   </g>

   <g id="gDOSE" class="drag" transform="translate(0,0)">
     <text id="DOSE" x="840" y="670" text-anchor="middle"
       font-family="'Inter',sans-serif" font-weight="400" font-size="28" letter-spacing="4" fill="#1C2639">30 ML</text>
   </g>

  </svg>
  </div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const TEXT={PRODUCT:'in_PRODUCT',DOSE:'in_DOSE'};
const SIZE={PRODUCT:'sz_PRODUCT',DOSE:'sz_DOSE'};
const GRP={PRODUCT:'gPRODUCT',DOSE:'gDOSE'};
const POS={PRODUCT:{x:0,y:0},DOSE:{x:0,y:0}};
let SCALE=1;

function applyPos(){for(const k in GRP)$(GRP[k]).setAttribute('transform',`translate(${POS[k].x},${POS[k].y})`);}
function sync(){
  for(const k in TEXT)$(k).textContent=$(TEXT[k]).value;
  for(const k in SIZE){const s=parseFloat($(SIZE[k]).value);if(s>0)$(k).style.fontSize=(s*SCALE)+'px';}
  $('prodSzVal').textContent=Math.round(parseFloat($('sz_PRODUCT').value)||34);
  applyPos();
}
document.querySelectorAll('.panel input:not(#scale):not(#sz_PRODUCT_num),.panel select').forEach(el=>{el.addEventListener('input',sync);el.addEventListener('change',sync);});
$('sz_PRODUCT').addEventListener('input',e=>{$('sz_PRODUCT_num').value=e.target.value;sync();});
$('sz_PRODUCT_num').addEventListener('input',e=>{const v=Math.min(80,Math.max(16,parseInt(e.target.value)||34));$('sz_PRODUCT').value=v;$('sz_PRODUCT_num').value=v;sync();});
$('scale').addEventListener('input',e=>{SCALE=parseFloat(e.target.value);$('scaleVal').textContent=Math.round(SCALE*100)+'%';sync();});
$('resetPos').addEventListener('click',()=>{for(const k in POS)POS[k]={x:0,y:0};applyPos();});

function svgPx(){return 1680/$('lbl').getBoundingClientRect().width;}
function enableDrag(gid,key){
  const g=$(gid);
  g.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const sc=svgPx(),sx=e.clientX,sy=e.clientY,bx=POS[key].x,by=POS[key].y;
    try{g.setPointerCapture(e.pointerId);}catch(_){}
    g.style.cursor='grabbing';
    const mv=ev=>{POS[key]={x:bx+(ev.clientX-sx)*sc,y:by+(ev.clientY-sy)*sc};g.setAttribute('transform',`translate(${POS[key].x},${POS[key].y})`);};
    const up=()=>{try{g.releasePointerCapture(e.pointerId);}catch(_){}g.style.cursor='grab';g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);};
    g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
  });
}
Object.keys(GRP).forEach(k=>enableDrag(GRP[k],k));

// Templates
const TPL_KEY='auro_tpl_v2';
function captureState(){return{pos:JSON.parse(JSON.stringify(POS)),scale:SCALE,text:{PRODUCT:$('in_PRODUCT').value,DOSE:$('in_DOSE').value},sizes:{PRODUCT:$('sz_PRODUCT').value,DOSE:$('sz_DOSE').value}};}
function applyState(s){Object.assign(POS,JSON.parse(JSON.stringify(s.pos)));SCALE=s.scale||1;$('scale').value=SCALE;$('scaleVal').textContent=Math.round(SCALE*100)+'%';for(const[k,v]of Object.entries(s.text)){const el=document.getElementById('in_'+k);if(el)el.value=v;}if(s.sizes){for(const[k,v]of Object.entries(s.sizes)){const el=document.getElementById('sz_'+k);if(el)el.value=v;}$('sz_PRODUCT').value=s.sizes.PRODUCT;$('sz_PRODUCT_num').value=s.sizes.PRODUCT;}sync();}
function loadTpls(){try{return JSON.parse(localStorage.getItem(TPL_KEY)||'[]');}catch{return[];}}
function saveTpls2(a){localStorage.setItem(TPL_KEY,JSON.stringify(a));}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderTpls(){const list=loadTpls();const el=$('tplList');if(!list.length){el.innerHTML='<div class="tpl-empty">No templates yet.</div>';return;}el.innerHTML=list.map((t,i)=>`<div class="tpl-row"><span class="tpl-name">${esc(t.name)}</span><button class="tpl-load" onclick="loadTpl(${i})">Load</button><button class="tpl-del" onclick="delTpl(${i})">✕</button></div>`).join('');}
function saveTpl(){const name=prompt('Template name:',($('in_PRODUCT').value||'My Label'));if(!name)return;const list=loadTpls();const idx=list.findIndex(t=>t.name===name);const entry={name,state:captureState(),saved:new Date().toISOString()};if(idx>=0)list[idx]=entry;else list.push(entry);saveTpls2(list);renderTpls();}
function loadTpl(i){const l=loadTpls();if(l[i])applyState(l[i].state);}
function delTpl(i){const l=loadTpls();l.splice(i,1);saveTpls2(l);renderTpls();}

// Catalog
const CAT={"Water / Diluents":[["Bacteriostatic Water","30 ML"],["Sterile Water","30 ML"],["Sodium Chloride 0.9%","30 ML"]],"Metabolic / GLP-1":[["Semaglutide","5 MG"],["Tirzepatide","10 MG"],["Retatrutide","10 MG"],["Cagrilintide","5 MG"],["Liraglutide","5 MG"],["AOD-9604","5 MG"],["MOTS-c","10 MG"]],"Growth Hormone Secretagogues":[["CJC-1295","5 MG"],["CJC-1295 (No DAC)","5 MG"],["Ipamorelin","5 MG"],["Sermorelin","5 MG"],["Tesamorelin","10 MG"],["GHRP-2","5 MG"],["GHRP-6","5 MG"],["HGH Fragment 176-191","5 MG"],["IGF-1 LR3","1 MG"]],"Healing / Recovery":[["BPC-157","5 MG"],["TB-500 (Thymosin b4)","5 MG"],["BPC-157 / TB-500","5/5 MG"],["GHK-Cu","50 MG"]],"Longevity / Anti-Aging":[["NAD+","500 MG"],["Epitalon","10 MG"],["SS-31","10 MG"],["Glutathione","600 MG"]],"Cognitive":[["Semax","30 MG"],["Selank","10 MG"],["Dihexa","5 MG"]],"Sexual Health":[["PT-141","10 MG"],["Oxytocin","2 MG"]]};
const ps=$('preset');
ps.appendChild(Object.assign(document.createElement('option'),{value:'__custom__',textContent:'✏️  Custom'}));
Object.entries(CAT).forEach(([g,items])=>{const og=document.createElement('optgroup');og.label=g;items.forEach(([n,d])=>{const o=document.createElement('option');o.value=n+'|'+d;o.textContent=n+' · '+d;og.appendChild(o);});ps.appendChild(og);});
ps.addEventListener('change',e=>{const v=e.target.value;if(!v)return;if(v==='__custom__'){$('in_PRODUCT').focus();return;}const[n,d]=v.split('|');$('in_PRODUCT').value=n.toUpperCase();$('in_DOSE').value=d;sync();});

function svgStr(){return new XMLSerializer().serializeToString($('lbl'));}
function dl(type){
  const name=($('in_PRODUCT').value||'auro-label').replace(/[^a-z0-9_\-]/gi,'_');
  const s=svgStr();
  if(type==='svg'){save(new Blob([s],{type:'image/svg+xml'}),name+'.svg');return;}
  const img=new Image(),url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));
  img.onload=()=>{const c=document.createElement('canvas');c.width=3360;c.height=1440;const ctx=c.getContext('2d');ctx.fillStyle='#F3F1EC';ctx.fillRect(0,0,3360,1440);ctx.drawImage(img,0,0,3360,1440);URL.revokeObjectURL(url);c.toBlob(b=>save(b,name+'.png'),'image/png',1.0);};
  img.src=url;
}
function save(blob,fn){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;a.click();}

renderTpls();sync();
</script>
</body>
</html>
