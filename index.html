<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Axis Chems — Design Hub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0A0A0F;
      --bg2: #111118;
      --bg3: #1A1A24;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.08);
      --navy: #0B4CB8;
      --blue: #1E7FE8;
      --cyan: #4FB3FF;
      --white: #FFFFFF;
      --gray1: #F0F0F5;
      --gray2: #A0A0B0;
      --gray3: #505060;
      --gray4: #2A2A38;
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 200ms cubic-bezier(0.4,0,0.2,1);
      --nav-h: 56px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── TOP BAR ── */
    #top-nav {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: var(--nav-h);
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      flex-shrink: 0;
      gap: 8px;
      position: relative;
      z-index: 100;
    }

    .top-logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-logo-mark {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, var(--navy), var(--cyan));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: #fff;
    }

    /* ── MAIN CONTENT ── */
    #main {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gray4); border-radius: 2px; }

    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      transition: background var(--transition), border-color var(--transition), transform var(--transition);
    }
    .card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.13); }

    /* ── STUDIO ── */
    #tab-studio {
      padding: 24px 20px;
      overflow-y: auto;
      flex: 1;
    }

    .studio-header { margin-bottom: 24px; }
    .studio-header h1 {
      font-size: 26px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--white), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .studio-header p { color: var(--gray2); font-size: 14px; margin-top: 4px; }

    .brand-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .brand-card {
      padding: 20px 18px 18px;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }
    .brand-card:hover { transform: translateY(-2px); }
    .brand-card:active { transform: translateY(0); }

    .brand-preview {
      height: 80px;
      border-radius: 10px;
      margin-bottom: 14px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .brand-label {
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      color: var(--gray2); text-transform: uppercase; margin-bottom: 4px;
    }
    .brand-name {
      font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: var(--white);
      margin-bottom: 14px;
    }
    .brand-cta {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 600; color: var(--cyan);
      transition: gap var(--transition);
    }
    .brand-card:hover .brand-cta { gap: 8px; }

    /* ── DESKTOP OVERRIDES ── */
    @media (min-width: 768px) {
      #tab-studio { padding: 32px; }
      .brand-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }
  </style>
</head>
<body>

<div id="app">

  <!-- TOP BAR -->
  <nav id="top-nav">
    <div class="top-logo">
      <div class="top-logo-mark">AC</div>
      Axis Design Hub
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <div id="tab-studio">
      <div class="studio-header">
        <h1>Brand Studio</h1>
        <p>Open a brand workspace to edit labels and assets.</p>
      </div>
      <div class="brand-grid">

        <a href="/axis-chems" class="card brand-card">
          <div class="brand-preview" style="background: linear-gradient(135deg, #0B4CB8 0%, #1E7FE8 60%, #4FB3FF 100%);">
            <svg width="100" height="48" viewBox="0 0 100 48" fill="none">
              <rect x="8" y="10" width="84" height="28" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
              <text x="50" y="29" text-anchor="middle" font-size="10" font-weight="800" fill="white" font-family="system-ui" letter-spacing="2">AXIS CHEMS</text>
            </svg>
          </div>
          <div class="brand-label">Brand 01</div>
          <div class="brand-name">Axis Chems</div>
          <div class="brand-cta">Open Studio <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        </a>

        <a href="/axiom-labz" class="card brand-card">
          <div class="brand-preview" style="background: linear-gradient(135deg, #1a0533 0%, #6d28d9 60%, #a78bfa 100%);">
            <svg width="100" height="48" viewBox="0 0 100 48" fill="none">
              <rect x="8" y="10" width="84" height="28" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
              <text x="50" y="29" text-anchor="middle" font-size="10" font-weight="800" fill="white" font-family="system-ui" letter-spacing="2">AXIOM LABZ</text>
            </svg>
          </div>
          <div class="brand-label">Brand 02</div>
          <div class="brand-name">Axiom Labz</div>
          <div class="brand-cta">Open Studio <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        </a>

        <a href="/emigenex" class="card brand-card">
          <div class="brand-preview" style="background: linear-gradient(135deg, #052e16 0%, #059669 60%, #34d399 100%);">
            <svg width="100" height="48" viewBox="0 0 100 48" fill="none">
              <rect x="8" y="10" width="84" height="28" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
              <text x="50" y="29" text-anchor="middle" font-size="10" font-weight="800" fill="white" font-family="system-ui" letter-spacing="2">EMIGENEX</text>
            </svg>
          </div>
          <div class="brand-label">Brand 03</div>
          <div class="brand-name">Emigenex</div>
          <div class="brand-cta">Open Studio <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        </a>

        <a href="/shelf-labels" class="card brand-card">
          <div class="brand-preview" style="background: linear-gradient(135deg, #08090C 0%, #0E1421 60%, #0B4CB8 100%);">
            <svg width="100" height="48" viewBox="0 0 100 48" fill="none">
              <rect x="4" y="8" width="92" height="32" rx="3" fill="rgba(255,255,255,0.06)" stroke="rgba(79,179,255,0.3)" stroke-width="1"/>
              <rect x="4" y="8" width="4" height="32" rx="1" fill="url(#lg1)"/>
              <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4FB3FF"/><stop offset="100%" stop-color="#0B4CB8"/></linearGradient></defs>
              <text x="54" y="28" text-anchor="middle" font-size="9" font-weight="800" fill="white" font-family="system-ui" letter-spacing="1">SHELF LABELS</text>
            </svg>
          </div>
          <div class="brand-label">Tool 01</div>
          <div class="brand-name">Label Studio</div>
          <div class="brand-cta">Open Studio <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        </a>

        <a href="/auro" class="card brand-card">
          <div class="brand-preview" style="background: linear-gradient(135deg, #3b1600 0%, #d97706 60%, #fbbf24 100%);">
            <svg width="100" height="48" viewBox="0 0 100 48" fill="none">
              <rect x="8" y="10" width="84" height="28" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
              <text x="50" y="29" text-anchor="middle" font-size="10" font-weight="800" fill="white" font-family="system-ui" letter-spacing="2">AURO</text>
            </svg>
          </div>
          <div class="brand-label">Brand 04</div>
          <div class="brand-name">Auro</div>
          <div class="brand-cta">Open Studio <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        </a>

      </div>
    </div>
  </div><!-- /main -->

</div><!-- /app -->

</body>
</html>
